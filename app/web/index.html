<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>img{max-width:100%}[hidden]{display:none!important}body{margin:0}</style>
<title>Conecta Empleos</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Sora:wght@600;700&family=Source+Sans+3:wght@400;500;600;700&display=swap">
<style>
/* Layout: classic job board — sticky header, search band, list + detail pages, company workspace */
:root{
  --bg:#F4F6F8; --surface:#FFFFFF; --sunken:#EBEFF3; --fg:#17222D; --muted:#5D6B78; --line:#D9E0E6;
  --brand:#124E78; --brand-soft:#DCE9F3; --brand-fg:#FFFFFF; --sun:#F2B134; --sun-soft:#FCEFD2; --sun-fg:#5A3D00;
  --good:#23794A; --good-soft:#DCF0E3; --warn:#9A5B06; --warn-soft:#F8E9D2; --bad:#B13A3A; --bad-soft:#F7E0E0;
  --display:"Sora", "Source Sans 3", system-ui, sans-serif;
  --body:"Source Sans 3", system-ui, -apple-system, "Segoe UI", sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0F161D; --surface:#16202A; --sunken:#1E2A36; --fg:#E5ECF2; --muted:#98A7B5; --line:#2A3846;
  --brand:#6FB0E0; --brand-soft:#17324A; --brand-fg:#08141E; --sun:#F2B134; --sun-soft:#3A2D12; --sun-fg:#F7D58A;
  --good:#6BC892; --good-soft:#173324; --warn:#E4A855; --warn-soft:#382912; --bad:#E77D7D; --bad-soft:#3A1D1D; color-scheme:dark;}}
:root[data-theme="dark"]{
  --bg:#0F161D; --surface:#16202A; --sunken:#1E2A36; --fg:#E5ECF2; --muted:#98A7B5; --line:#2A3846;
  --brand:#6FB0E0; --brand-soft:#17324A; --brand-fg:#08141E; --sun:#F2B134; --sun-soft:#3A2D12; --sun-fg:#F7D58A;
  --good:#6BC892; --good-soft:#173324; --warn:#E4A855; --warn-soft:#382912; --bad:#E77D7D; --bad-soft:#3A1D1D; color-scheme:dark;}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--body);font-size:16px;line-height:1.5}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--surface)}
.wrap{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.inner{max-width:1180px;margin:0 auto}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--brand);outline-offset:2px}
h1,h2,h3,h4{font-family:var(--display);text-wrap:balance;margin:0;line-height:1.2;letter-spacing:-.01em}
.muted{color:var(--muted)}
.small{font-size:14px}

header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--surface);border-bottom:1px solid var(--line)}
.top-in{display:flex;align-items:center;gap:18px;flex-wrap:wrap;padding-block:10px}
.logo{display:flex;align-items:center;gap:9px;font-family:var(--display);font-weight:700;font-size:19px;cursor:pointer;border:0;background:none;padding:0}
.logo i{width:28px;height:28px;border-radius:8px;background:var(--brand);display:grid;place-items:center;color:var(--brand-fg);font-style:normal;font-size:15px}
nav.main{display:flex;gap:2px;margin-right:auto;flex-wrap:wrap}
nav.main button{border:0;background:none;padding:7px 11px;border-radius:7px;cursor:pointer;color:var(--muted);font-weight:600}
nav.main button:hover{color:var(--fg);background:var(--sunken)}
nav.main button.on{color:var(--brand);background:var(--brand-soft)}
.session{display:flex;align-items:center;gap:8px}
.avatar{width:32px;height:32px;border-radius:50%;display:grid;place-items:center;font-weight:700;font-size:13px;color:#fff;flex:none}
.session select{width:auto;max-width:220px;padding:6px 8px}

input,select,textarea{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:9px 11px;width:100%;min-width:0}
textarea{resize:vertical;min-height:110px}
.btn{border:1px solid var(--line);background:var(--surface);padding:9px 16px;border-radius:8px;cursor:pointer;font-weight:600;white-space:nowrap}
.btn:hover{background:var(--sunken)}
.btn.primary{background:var(--brand);border-color:var(--brand);color:var(--brand-fg)}
.btn.primary:hover{filter:brightness(1.08)}
.btn.sun{background:var(--sun);border-color:var(--sun);color:#3A2700}
.btn.sm{padding:5px 11px;font-size:14px}
.btn[disabled]{opacity:.55;cursor:default}
.link{border:0;background:none;color:var(--brand);cursor:pointer;padding:0;font-weight:600}
.link:hover{text-decoration:underline}

.hero{background:var(--brand);color:var(--brand-fg)}
.hero .inner{padding-block:28px 26px;display:flex;flex-direction:column;gap:14px}
.hero h1{font-size:clamp(24px,3.2vw,32px)}
.hero p{margin:0;opacity:.85}
.search{display:grid;grid-template-columns:minmax(0,2fr) minmax(0,1fr) minmax(0,1fr) auto;gap:8px;background:var(--surface);padding:8px;border-radius:12px}
@media (max-width:760px){.search{grid-template-columns:minmax(0,1fr)}}
.search input,.search select{border-color:transparent;background:var(--bg)}

.page{padding-block:24px 48px;display:flex;flex-direction:column;gap:22px}
.layout{display:grid;grid-template-columns:minmax(0,1fr) 320px;gap:22px;align-items:start}
@media (max-width:920px){.layout{grid-template-columns:minmax(0,1fr)}}
.col{display:flex;flex-direction:column;gap:14px;min-width:0}
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:18px}
.head-row{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.head-row h2{font-size:20px;margin-right:auto}
.head-row select{width:auto}

.jobcard{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:16px;display:grid;grid-template-columns:48px minmax(0,1fr) auto;gap:14px;cursor:pointer;text-align:left;width:100%}
.jobcard:hover{border-color:var(--brand)}
.logo-co{width:48px;height:48px;border-radius:10px;display:grid;place-items:center;color:#fff;font-family:var(--display);font-weight:700;font-size:17px}
.jobcard h3{font-size:17px}
.jobcard .co{color:var(--muted);font-size:14.5px;margin-top:2px}
.meta{display:flex;flex-wrap:wrap;gap:4px 14px;font-size:14px;color:var(--muted);margin-top:8px}
.meta b{color:var(--fg);font-weight:600}
.side{display:flex;flex-direction:column;align-items:flex-end;gap:8px;text-align:right}
@media (max-width:600px){.jobcard{grid-template-columns:40px minmax(0,1fr)}.logo-co{width:40px;height:40px;font-size:15px}.side{grid-column:1/-1;flex-direction:row;justify-content:space-between;align-items:center}}
.ago{font-size:13px;color:var(--muted)}
.match{display:inline-flex;align-items:center;gap:6px;font-weight:700;font-size:13.5px;padding:3px 10px;border-radius:999px;white-space:nowrap;font-variant-numeric:tabular-nums}
.match.hi{background:var(--good-soft);color:var(--good)} .match.mid{background:var(--brand-soft);color:var(--brand)} .match.lo{background:var(--sunken);color:var(--muted)}
.tagrow{display:flex;flex-wrap:wrap;gap:6px}
.tag{font-size:13px;padding:2px 10px;border-radius:999px;background:var(--sunken);white-space:nowrap}
.tag.ok{background:var(--good-soft);color:var(--good)} .tag.miss{background:var(--warn-soft);color:var(--warn)}
.status{font-size:12.5px;font-weight:700;padding:2px 9px;border-radius:999px;background:var(--brand-soft);color:var(--brand)}
.status.applied{background:var(--good-soft);color:var(--good)}

.recs{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,230px),1fr));gap:12px}
.rec{background:var(--sun-soft);border-radius:12px;padding:14px;display:flex;flex-direction:column;gap:6px;cursor:pointer;border:1px solid transparent;text-align:left}
.rec:hover{border-color:var(--sun)}
.rec h4{font-size:15.5px}
.rec .why{font-size:13.5px;color:var(--sun-fg)}
.section-title{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.section-title h2{font-size:19px}

.detail h1{font-size:clamp(22px,3vw,28px)}
.detail .desc{white-space:pre-line;max-width:70ch}
.fit{display:flex;flex-direction:column;gap:12px}
.fit-score{display:flex;align-items:center;gap:14px}
.ring{width:72px;height:72px;border-radius:50%;background:conic-gradient(var(--c) calc(var(--p)*1%),var(--sunken) 0);display:grid;place-items:center;position:relative;flex:none}
.ring::after{content:"";position:absolute;inset:7px;border-radius:50%;background:var(--surface)}
.ring span{position:relative;z-index:1;font-family:var(--display);font-weight:700;font-size:18px}
.fit ul{margin:0;padding-left:18px;font-size:14.5px;color:var(--muted)}
.facts{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:12px}
.facts div{display:flex;flex-direction:column}
.facts span{font-size:13px;color:var(--muted)}
.facts b{font-weight:600}

.form{display:flex;flex-direction:column;gap:14px}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,220px),1fr));gap:12px}
.field{display:flex;flex-direction:column;gap:5px;min-width:0}
.field label{font-size:14px;font-weight:600}
.field .hint{font-size:13px;color:var(--muted)}
.notice{border-radius:8px;padding:10px 12px;font-size:14.5px}
.notice.ok{background:var(--good-soft);color:var(--good)} .notice.err{background:var(--bad-soft);color:var(--bad)} .notice.info{background:var(--brand-soft);color:var(--brand)}

.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.tabs button{border:0;background:none;padding:9px 14px;cursor:pointer;font-weight:600;color:var(--muted);border-bottom:2px solid transparent;margin-bottom:-1px}
.tabs button.on{color:var(--brand);border-bottom-color:var(--brand)}
.person{display:grid;grid-template-columns:44px minmax(0,1fr) auto;gap:12px;align-items:start;padding:14px 0;border-bottom:1px solid var(--line)}
.person:last-child{border-bottom:0}
.person h4{font-size:16px}
@media (max-width:600px){.person{grid-template-columns:44px minmax(0,1fr)}.person .side{grid-column:1/-1}}
.table{width:100%;border-collapse:collapse;font-size:15px}
.table th{text-align:left;font-size:13px;color:var(--muted);font-weight:600;padding:8px 10px;border-bottom:1px solid var(--line)}
.table td{padding:12px 10px;border-bottom:1px solid var(--line);vertical-align:middle}
.table tr:last-child td{border-bottom:0}
.tablewrap{overflow-x:auto}
.empty{padding:26px;text-align:center;color:var(--muted);border:1px dashed var(--line);border-radius:12px}
footer{border-top:1px solid var(--line);background:var(--surface)}
footer .inner{padding-block:18px;display:flex;gap:12px 22px;flex-wrap:wrap;font-size:14px;color:var(--muted);align-items:center}
footer .inner span:first-child{margin-right:auto}
.toast{position:fixed;bottom:calc(16px + env(safe-area-inset-bottom,0px));left:50%;transform:translateX(-50%);background:var(--fg);color:var(--bg);padding:10px 18px;border-radius:8px;font-size:15px;z-index:20;max-width:calc(100vw - 32px)}
.powered{font-size:12.5px;color:var(--muted)}
.code{font-family:ui-monospace,Menlo,monospace;font-size:13px}
</style>
</head>
<body>

<header class="top">
  <div class="top-in wrap inner">
    <button class="logo" id="home" aria-label="Inicio"><i>C</i>Conecta Empleos</button>
    <nav class="main" id="nav"></nav>
    <div class="session">
      <span class="avatar" id="sessAvatar" aria-hidden="true"></span>
      <label class="small muted" for="sess">Sesión</label>
      <select id="sess"></select>
    </div>
  </div>
</header>

<div id="app"></div>

<footer class="wrap"><div class="inner">
  <span>Conecta Empleos · datos de ejemplo</span>
  <button class="link" id="goIntegration">Integración NeoConexión</button>
  <button class="link" id="resetAll">Restaurar datos</button>
</div></footer>

<script>
(() => {
/* =================================================================
   CAPA 1 · MOTOR NEOCONEXIÓN EMBEBIDO
   Réplica del contrato /api/v1. Se usa cuando la app no tiene
   una URL de API configurada. Misma fórmula 50/25/15/10.
   ================================================================= */
const Engine = (() => {
  const W = { skills: .5, experience: .25, location: .15, workMode: .1 };
  const KEY = "neoconexion-engine-v1";
  const k = s => String(s).trim().toLowerCase();
  const r1 = n => Math.round(n * 10) / 10;
  let g;
  const blank = () => ({ candidates: {}, jobs: {}, names: { skill: {}, location: {}, company: {} } });
  try { g = JSON.parse(localStorage.getItem(KEY)) || blank(); } catch (e) { g = blank(); }
  const save = () => { try { localStorage.setItem(KEY, JSON.stringify(g)); } catch (e) {} };
  const canon = (kind, v) => { const kk = k(v); if (!g.names[kind][kk]) g.names[kind][kk] = String(v).trim(); return g.names[kind][kk]; };
  const dedupe = l => { const s = new Set(), o = []; for (const x of l) { const t = String(x).trim(); if (t && !s.has(k(t))) { s.add(k(t)); o.push(t); } } return o; };
  const err = (status, code, message, details = null) => ({ status, body: { error: { code, message, details } } });

  function validate(b, spec) {
    const e = [], add = (f, msg) => e.push({ loc: ["body", f], msg });
    if (!b || typeof b !== "object") return [{ loc: ["body"], msg: "Se esperaba un objeto" }];
    for (const f in b) if (!spec[f]) add(f, "Campo no permitido");
    for (const [f, r] of Object.entries(spec)) {
      const v = b[f];
      if (v === undefined) { if (r.req) add(f, "Campo obligatorio"); continue; }
      if (v === null) { if (!r.null) add(f, "No admite null"); continue; }
      if (r.t === "s" && (typeof v !== "string" || v.trim().length < (r.min ?? 1) || v.length > r.max)) add(f, "Texto inválido");
      if (r.t === "n" && (typeof v !== "number" || !isFinite(v) || v < 0)) add(f, "Número finito ≥ 0");
      if (r.t === "e" && !r.v.includes(v)) add(f, "Valor no admitido");
      if (r.t === "l" && (!Array.isArray(v) || v.length > 100 || v.some(x => typeof x !== "string" || !x.trim() || x.length > 100))) add(f, "Lista inválida");
    }
    return e;
  }
  const CS = { id: { t: "s", req: 1, max: 128 }, name: { t: "s", req: 1, max: 200 }, location: { t: "s", req: 1, max: 200 }, yearsOfExperience: { t: "n", req: 1 }, skills: { t: "l", req: 1 }, preferredWorkMode: { t: "e", req: 1, v: ["remote", "hybrid", "onsite", "any"] }, expectedSalary: { t: "n", null: 1 } };
  const JS = { id: { t: "s", req: 1, max: 128 }, company: { t: "s", req: 1, max: 200 }, title: { t: "s", req: 1, max: 200 }, description: { t: "s", null: 1, min: 0, max: 5000 }, location: { t: "s", req: 1, max: 200 }, workMode: { t: "e", req: 1, v: ["remote", "hybrid", "onsite"] }, requiredExperience: { t: "n", req: 1 }, requiredSkills: { t: "l", req: 1 }, desiredSkills: { t: "l" } };

  function score(c, j) {
    const have = new Set(c.skills.map(k));
    const rh = j.requiredSkills.filter(s => have.has(k(s))), dh = j.desiredSkills.filter(s => have.has(k(s)));
    const rc = j.requiredSkills.length ? rh.length / j.requiredSkills.length : 1, dc = j.desiredSkills.length ? dh.length / j.desiredSkills.length : 1;
    const skills = !j.requiredSkills.length ? 100 : j.desiredSkills.length ? 70 * rc + 30 * dc : 100 * rc;
    const experience = j.requiredExperience === 0 ? 100 : Math.min(1, c.yearsOfExperience / j.requiredExperience) * 100;
    const remote = j.workMode === "remote", same = k(c.location) === k(j.location);
    const location = remote || same ? 100 : 0;
    const cm = c.preferredWorkMode, jm = j.workMode;
    const workMode = cm === jm || cm === "any" ? 100 : (cm === "hybrid" || jm === "hybrid") ? 50 : 0;
    const ex = [`Cumple ${rh.length} de ${j.requiredSkills.length} habilidades obligatorias`];
    if (j.desiredSkills.length) ex.push(`Cumple ${dh.length} de ${j.desiredSkills.length} habilidades deseables`);
    ex.push(`${c.yearsOfExperience >= j.requiredExperience ? "Experiencia suficiente" : "Experiencia insuficiente"} (${c.yearsOfExperience} años vs ${j.requiredExperience} requeridos)`);
    ex.push(remote ? "Vacante remota: ubicación compatible" : same ? `Misma ubicación (${j.location})` : `Ubicación diferente (${c.location} vs ${j.location})`);
    ex.push(workMode === 100 ? "Modalidad de trabajo compatible" : workMode === 50 ? "Modalidad parcialmente compatible" : "Modalidad de trabajo incompatible");
    return { matchScore: r1(skills * W.skills + experience * W.experience + location * W.location + workMode * W.workMode),
      breakdown: { skills: r1(skills), experience: r1(experience), location, workMode },
      matchingSkills: [...rh, ...dh], missingSkills: j.requiredSkills.filter(s => !have.has(k(s))), explanations: ex, passesSkillPrefilter: rh.length + dh.length > 0 };
  }
  function lm(q) {
    const limit = q.has("limit") ? +q.get("limit") : 10, minScore = q.has("minScore") ? +q.get("minScore") : 0;
    return (!Number.isInteger(limit) || limit < 1 || limit > 50 || !(minScore >= 0 && minScore <= 100)) ? null : { limit, minScore };
  }
  const rank = (a, b) => b.matchScore - a.matchScore || (a._id < b._id ? -1 : 1);

  function handle(method, url, body) {
    const [path, qs] = url.split("?"), q = new URLSearchParams(qs || "");
    const s = path.split("/").filter(Boolean).map(decodeURIComponent);
    if (path === "/health" || path === "/health/db") return { status: 200, body: { status: "ok" } };
    const [, , res, id, sub, subId, subsub] = s;
    if (res === "candidates") {
      if (method === "POST" && !id) {
        const e = validate(body, CS); if (e.length) return err(422, "VALIDATION_ERROR", "La solicitud no es válida.", e);
        const c = { ...body, id: body.id.trim(), name: body.name.trim(), expectedSalary: body.expectedSalary ?? null };
        const created = !g.candidates[c.id];
        g.candidates[c.id] = { ...c, location: canon("location", c.location), skills: dedupe(c.skills).map(x => canon("skill", x)) }; save();
        return { status: created ? 201 : 200, body: g.candidates[c.id] };
      }
      const c = g.candidates[id]; if (!c) return err(404, "NOT_FOUND", "Candidato no encontrado.");
      if (method === "GET" && !sub) return { status: 200, body: c };
      if (sub === "recommendations") {
        const p = lm(q); if (!p) return err(422, "VALIDATION_ERROR", "Parámetros inválidos.");
        const all = Object.values(g.jobs).map(j => [j, score(c, j)]).filter(([, r]) => r.passesSkillPrefilter && r.matchScore >= p.minScore)
          .map(([j, r]) => ({ _id: j.id, jobId: j.id, title: j.title, company: j.company, matchScore: r.matchScore, breakdown: r.breakdown, matchingSkills: r.matchingSkills, missingSkills: r.missingSkills, explanations: r.explanations })).sort(rank);
        return { status: 200, body: { candidateId: id, total: all.length, recommendations: all.slice(0, p.limit).map(({ _id, ...x }) => x) } };
      }
      if (sub === "jobs" && subsub === "diagnosis") {
        const j = g.jobs[subId]; if (!j) return err(404, "NOT_FOUND", "Vacante no encontrada.");
        return { status: 200, body: { candidateId: id, jobId: subId, ...score(c, j) } };
      }
    }
    if (res === "jobs") {
      if (method === "POST" && !id) {
        const e = validate(body, JS); if (e.length) return err(422, "VALIDATION_ERROR", "La solicitud no es válida.", e);
        const req = dedupe(body.requiredSkills), rk = new Set(req.map(k));
        const j = { ...body, id: body.id.trim(), description: body.description || null, requiredSkills: req, desiredSkills: dedupe(body.desiredSkills || []).filter(x => !rk.has(k(x))) };
        const created = !g.jobs[j.id];
        g.jobs[j.id] = { ...j, company: canon("company", j.company), location: canon("location", j.location), requiredSkills: j.requiredSkills.map(x => canon("skill", x)), desiredSkills: j.desiredSkills.map(x => canon("skill", x)) }; save();
        return { status: created ? 201 : 200, body: g.jobs[j.id] };
      }
      const j = g.jobs[id]; if (!j) return err(404, "NOT_FOUND", "Vacante no encontrada.");
      if (method === "GET" && !sub) return { status: 200, body: j };
      if (sub === "candidates") {
        const p = lm(q); if (!p) return err(422, "VALIDATION_ERROR", "Parámetros inválidos.");
        const all = Object.values(g.candidates).map(c => [c, score(c, j)]).filter(([, r]) => r.passesSkillPrefilter && r.matchScore >= p.minScore)
          .map(([c, r]) => ({ _id: c.id, candidateId: c.id, name: c.name, matchScore: r.matchScore, breakdown: r.breakdown, matchingSkills: r.matchingSkills, missingSkills: r.missingSkills, explanations: r.explanations })).sort(rank);
        return { status: 200, body: { jobId: id, total: all.length, recommendations: all.slice(0, p.limit).map(({ _id, ...x }) => x) } };
      }
    }
    return err(404, "NOT_FOUND", "Ruta no encontrada.");
  }
  return { handle, reset() { g = blank(); save(); } };
})();

/* =================================================================
   CAPA 2 · CLIENTE NEOCONEXIÓN
   Único punto de la app que habla con la API. Modo "embedded" usa
   el motor local; modo "http" llama a tu API real (baseUrl + X-API-Key).
   ================================================================= */
const CONFIG_KEY = "conecta-neoconexion-config";
const NeoConexion = {
  config: (() => { try { return JSON.parse(localStorage.getItem(CONFIG_KEY)) || { mode: "embedded", baseUrl: "http://localhost:8000", apiKey: "" }; } catch (e) { return { mode: "embedded", baseUrl: "http://localhost:8000", apiKey: "" }; } })(),
  saveConfig(c) { this.config = c; try { localStorage.setItem(CONFIG_KEY, JSON.stringify(c)); } catch (e) {} },
  async request(method, path, body) {
    if (this.config.mode !== "http") return Engine.handle(method, path, body === undefined ? undefined : JSON.parse(JSON.stringify(body)));
    const headers = { "Accept": "application/json" };
    if (body !== undefined) headers["Content-Type"] = "application/json";
    if (this.config.apiKey) headers["X-API-Key"] = this.config.apiKey;
    try {
      const res = await fetch(this.config.baseUrl.replace(/\/$/, "") + path, { method, headers, body: body === undefined ? undefined : JSON.stringify(body) });
      return { status: res.status, body: await res.json().catch(() => null) };
    } catch (e) { return { status: 0, body: { error: { code: "NETWORK", message: "No se pudo conectar con la API." } } }; }
  },
  health() { return this.request("GET", "/health/db"); },
  upsertCandidate(c) { return this.request("POST", "/api/v1/candidates", c); },
  upsertJob(j) { return this.request("POST", "/api/v1/jobs", j); },
  recommendationsFor(candidateId, limit = 50, minScore = 0) { return this.request("GET", `/api/v1/candidates/${encodeURIComponent(candidateId)}/recommendations?limit=${limit}&minScore=${minScore}`); },
  candidatesFor(jobId, limit = 50, minScore = 0) { return this.request("GET", `/api/v1/jobs/${encodeURIComponent(jobId)}/candidates?limit=${limit}&minScore=${minScore}`); },
  diagnosis(candidateId, jobId) { return this.request("GET", `/api/v1/candidates/${encodeURIComponent(candidateId)}/jobs/${encodeURIComponent(jobId)}/diagnosis`); }
};

  if (m.type === "cand") {
    const r = await NeoConexion.recommendationsFor(m.user.id, 50, 0);
    if (r.status === 200) { recs = r.body.recommendations; recs.forEach(x => scores[x.jobId] = x.matchScore); } else apiDown = true;
  }
  const cities = [...new Set(D.jobs.map(j => j.city))].sort();
  const t = filters.q.toLowerCase();
  let list = D.jobs.filter(j => !t || [j.title, j.description, P.company(j.companyId).name, ...j.requiredSkills].join(" ").toLowerCase().includes(t))
    .filter(j => !filters.city || j.city === filters.city).filter(j => !filters.mode || j.workMode === filters.mode);
  list.sort(filters.sort === "match" ? (a, b) => (scores[b.id] ?? -1) - (scores[a.id] ?? -1) : (a, b) => b.postedAt - a.postedAt);
  const top = recs.filter(r => r.matchScore >= 60).slice(0, 3);
  app.innerHTML = `
  <section class="hero wrap"><div class="inner">
    <h1>${m.type === "cand" ? `Hola, ${esc(m.user.name.split(" ")[0])}. Estas son tus oportunidades.` : "Encuentra tu próximo empleo"}</h1>

      <input id="fq" placeholder="Cargo, empresa o habilidad" value="${esc(filters.q)}" aria-label="Buscar">
      <select id="fc" aria-label="Ciudad"><option value="">Todas las ciudades</option>${cities.map(c => `<option${c === filters.city ? " selected" : ""}>${esc(c)}</option>`).join("")}</select>
      <select id="fm" aria-label="Modalidad"><option value="">Cualquier modalidad</option>${["remote", "hybrid", "onsite"].map(x => `<option value="${x}"${x === filters.mode ? " selected" : ""}>${MODE[x]}</option>`).join("")}</select>
      <button class="btn sun" type="submit">Buscar</button>
    </form>
  </div></section>
  <div class="page wrap"><div class="inner col" style="gap:22px">
    ${apiDown ? `<div class="notice err">No pudimos calcular tu compatibilidad en este momento. Puedes seguir explorando las vacantes.</div>` : ""}
    ${top.length ? `<section class="col"><div class="section-title"><h2>Recomendadas para ti</h2><span class="powered">según tu perfil · motor NeoConexión</span></div>
      <div class="recs">${top.map(r => { const j = P.job(r.jobId); return j ? `<button class="rec" data-go="vacante" data-id="${j.id}">${matchPill(r.matchScore)}<h4>${esc(j.title)}</h4><span class="small muted">${esc(P.company(j.companyId).name)} · ${esc(j.city)}</span><span class="why">Tienes ${r.matchingSkills.slice(0, 3).map(esc).join(", ")}</span></button>` : ""; }).join("")}</div></section>` : ""}
    <section class="col">
      <div class="head-row"><h2>${list.length} ${list.length === 1 ? "vacante" : "vacantes"}</h2>
        ${m.type === "cand" ? `<label class="small muted" for="fs">Ordenar por</label><select id="fs"><option value="recent">Más recientes</option><option value="match"${filters.sort === "match" ? " selected" : ""}>Mayor compatibilidad</option></select>` : ""}</div>
      ${list.map(j => jobCard(j, m.type === "cand" ? scores[j.id] ?? null : null, m.type === "cand" ? m.user.id : null)).join("") || `<div class="empty">No encontramos vacantes con esos filtros.</div>`}
    </section>

  document.getElementById("sf").onsubmit = e => { e.preventDefault(); filters.q = fq.value.trim(); filters.city = fc.value; filters.mode = fm.value; viewEmpleos(); };

}

    <div class="layout">
      <article class="card col detail">
        <div class="head-row" style="gap:14px"><span class="logo-co" style="background:${co.color}">${initials(co.name)}</span>
          <div style="min-width:0;margin-right:auto"><h1>${esc(j.title)}</h1><div class="muted">${esc(co.name)} · ${esc(co.sector)}</div></div></div>
        <div class="facts">
          <div><span>Ubicación</span><b>${esc(j.city)}</b></div><div><span>Modalidad</span><b>${MODE[j.workMode]}</b></div>
          <div><span>Salario mensual</span><b>${salary(j)}</b></div><div><span>Contrato</span><b>${esc(j.contract)}</b></div>
          <div><span>Experiencia</span><b>${j.experience} ${j.experience === 1 ? "año" : "años"}</b></div><div><span>Publicación</span><b>${ago(j.postedAt)}</b></div></div>
        <div><h3 style="font-size:17px;margin-bottom:6px">Descripción</h3><p class="desc" style="margin:0">${esc(j.description)}</p></div>
        <div><h3 style="font-size:17px;margin-bottom:8px">Requisitos</h3><div class="tagrow">${j.requiredSkills.map(s => `<span class="tag">${esc(s)}</span>`).join("")}</div></div>
        ${j.desiredSkills.length ? `<div><h3 style="font-size:17px;margin-bottom:8px">Deseable</h3><div class="tagrow">${j.desiredSkills.map(s => `<span class="tag">${esc(s)}</span>`).join("")}</div></div>` : ""}
      </article>
      <aside class="col">${fit}</aside>
    </div></div></div>`;
  const ap = document.getElementById("apply");
  if (ap) ap.onclick = () => { D.applications.push({ id: "a-" + Date.now(), jobId: j.id, candidateId: me().user.id, at: Date.now(), status: "Enviada" }); saveData(); toast(`Postulación enviada a ${co.name}.`); viewVacante(); };
}

/* ---------- Candidato: postulaciones ---------- */
async function viewPostulaciones() {
  const m = me(); if (m.type !== "cand") return go("empleos");
  const apps = P.appsForCand(m.user.id).sort((a, b) => b.at - a.at);
  const r = await NeoConexion.recommendationsFor(m.user.id, 50, 0);
  const sc = {}; if (r.status === 200) r.body.recommendations.forEach(x => sc[x.jobId] = x.matchScore);
  app.innerHTML = `<div class="page wrap"><div class="inner col">
    <h1 style="font-size:26px">Mis postulaciones</h1>
    ${apps.length ? `<div class="card tablewrap"><table class="table"><thead><tr><th>Vacante</th><th>Empresa</th><th>Fecha</th><th>Compatibilidad</th><th>Estado</th></tr></thead><tbody>
      ${apps.map(a => { const j = P.job(a.jobId); if (!j) return ""; return `<tr><td><button class="link" data-go="vacante" data-id="${j.id}">${esc(j.title)}</button></td><td>${esc(P.company(j.companyId).name)}</td><td>${new Date(a.at).toLocaleDateString("es-CO")}</td><td>${sc[j.id] != null ? matchPill(sc[j.id]) : `<span class="muted small">—</span>`}</td><td><span class="status">${esc(a.status)}</span></td></tr>`; }).join("")}
    </tbody></table></div>` : `<div class="empty">Aún no te has postulado. <button class="link" data-go="empleos">Explora vacantes</button></div>`}
  </div></div>`;
}

/* ---------- Candidato: perfil ---------- */
function viewPerfil() {
  const m = me(); if (m.type !== "cand") return go("empleos");
  const u = m.user;
  app.innerHTML = `<div class="page wrap"><div class="inner col" style="max-width:760px">
    <h1 style="font-size:26px">Mi perfil</h1>
    <p class="muted" style="margin:0">Mantén tu perfil al día: tus recomendaciones se actualizan cada vez que lo guardas.</p>
    <form class="card form" id="pf" novalidate>
      <div class="grid2"><div class="field"><label for="p_name">Nombre completo</label><input id="p_name" value="${esc(u.name)}" required></div>
        <div class="field"><label for="p_head">Título profesional</label><input id="p_head" value="${esc(u.headline)}"></div></div>
      <div class="grid2"><div class="field"><label for="p_city">Ciudad</label><input id="p_city" value="${esc(u.city)}" required></div>
        <div class="field"><label for="p_years">Años de experiencia</label><input id="p_years" type="number" min="0" step="0.5" value="${u.years}"></div></div>
      <div class="field"><label for="p_skills">Habilidades</label><input id="p_skills" value="${esc(u.skills.join(", "))}"><span class="hint">Sepáralas con comas. Ej: Excel, Ventas, Python</span></div>
      <div class="grid2"><div class="field"><label for="p_mode">Modalidad preferida</label><select id="p_mode">${["remote", "hybrid", "onsite", "any"].map(x => `<option value="${x}"${x === u.workMode ? " selected" : ""}>${MODE[x]}</option>`).join("")}</select></div>
        <div class="field"><label for="p_sal">Aspiración salarial mensual (COP)</label><input id="p_sal" type="number" min="0" step="100000" value="${u.salary ?? ""}"></div></div>
      <div id="p_msg"></div>
      <div><button class="btn primary" type="submit">Guardar perfil</button></div>
    </form></div></div>`;
  document.getElementById("pf").onsubmit = async e => {
    e.preventDefault();
    const msg = document.getElementById("p_msg");
    const upd = { ...u, name: p_name.value.trim(), headline: p_head.value.trim(), city: p_city.value.trim(), years: Number(p_years.value || 0),
      skills: p_skills.value.split(",").map(s => s.trim()).filter(Boolean), workMode: p_mode.value, salary: p_sal.value === "" ? null : Number(p_sal.value) };
    if (!upd.name || !upd.city) { msg.innerHTML = `<div class="notice err">Escribe tu nombre y tu ciudad.</div>`; return; }
    if (!(upd.years >= 0)) { msg.innerHTML = `<div class="notice err">Los años de experiencia deben ser 0 o más.</div>`; return; }
    Object.assign(u, upd); saveData();
    const r = await NeoConexion.upsertCandidate(toApiCandidate(u));
    msg.innerHTML = r.status < 300 ? `<div class="notice ok">Perfil guardado. <button class="link" data-go="empleos" type="button">Ver mis recomendaciones</button></div>`
      : `<div class="notice err">Guardamos tu perfil, pero no pudimos actualizar tus recomendaciones. Intenta de nuevo más tarde.</div>`;
    renderSession();
  };
}

/* ---------- Empresa: mis vacantes ---------- */
async function viewEmpresa() {
  const m = me(); if (m.type !== "co") return go("empleos");
  const jobs = D.jobs.filter(j => j.companyId === m.user.id).sort((a, b) => b.postedAt - a.postedAt);
  const counts = {};
  for (const j of jobs) { const r = await NeoConexion.candidatesFor(j.id, 50, 60); counts[j.id] = r.status === 200 ? r.body.total : null; }
  app.innerHTML = `<div class="page wrap"><div class="inner col">
    <div class="head-row"><div style="margin-right:auto"><h1 style="font-size:26px">Mis vacantes</h1><span class="muted">${esc(m.user.name)} · ${esc(m.user.sector)}</span></div>
      <button class="btn primary" data-go="publicar">Publicar vacante</button></div>
    ${jobs.length ? `<div class="card tablewrap"><table class="table"><thead><tr><th>Vacante</th><th>Ciudad</th><th>Publicada</th><th>Postulados</th><th>Sugeridos ≥60 %</th><th></th></tr></thead><tbody>
      ${jobs.map(j => `<tr><td><b>${esc(j.title)}</b><div class="small muted">${MODE[j.workMode]} · ${salary(j)}</div></td><td>${esc(j.city)}</td><td>${ago(j.postedAt)}</td><td>${P.appsForJob(j.id).length}</td><td>${counts[j.id] ?? "—"}</td><td><button class="btn sm" data-go="gestion" data-id="${j.id}">Gestionar</button></td></tr>`).join("")}
    </tbody></table></div>` : `<div class="empty">Todavía no has publicado vacantes. <button class="link" data-go="publicar">Publica la primera</button></div>`}
  </div></div>`;
}

/* ---------- Empresa: gestión de una vacante ---------- */
let gestionTab = "postulados";
function personRow(c, r, actions) {
  return `<div class="person"><span class="avatar" style="width:44px;height:44px;background:${colorFor(c.id)}">${initials(c.name)}</span>
    <div style="min-width:0"><h4>${esc(c.name)}</h4><div class="small muted">${esc(c.headline)} · ${esc(c.city)} · ${c.years} años · prefiere ${MODE[c.workMode].toLowerCase()}</div>
      ${r ? `<div class="tagrow" style="margin-top:8px">${r.matchingSkills.map(s => `<span class="tag ok">✓ ${esc(s)}</span>`).join("")}${r.missingSkills.map(s => `<span class="tag miss">Sin ${esc(s)}</span>`).join("")}</div>
      <div class="small muted" style="margin-top:6px">${esc(r.explanations.slice(-3).join(" · "))}</div>` : ""}</div>
    <div class="side">${r ? matchPill(r.matchScore) : ""}${actions}</div></div>`;
}
async function viewGestion() {
  const j = P.job(route.id), m = me(); if (!j || m.type !== "co" || j.companyId !== m.user.id) return go("empresa");
  const apps = P.appsForJob(j.id);
  const appRows = [];
  for (const a of apps) { const c = P.cand(a.candidateId); if (!c) continue; const r = await NeoConexion.diagnosis(c.id, j.id); appRows.push({ a, c, r: r.status === 200 ? r.body : null }); }
  appRows.sort((x, y) => (y.r?.matchScore ?? 0) - (x.r?.matchScore ?? 0));
  const sug = await NeoConexion.candidatesFor(j.id, 20, 0);
  const applied = new Set(apps.map(a => a.candidateId));
  const sugRows = sug.status === 200 ? sug.body.recommendations.filter(r => !applied.has(r.candidateId) && P.cand(r.candidateId)) : [];
  const invited = id => D.invites.some(i => i.jobId === j.id && i.candidateId === id);
  app.innerHTML = `<div class="page wrap"><div class="inner col">
    <button class="link" data-go="empresa" style="align-self:flex-start">← Mis vacantes</button>
    <div class="card head-row"><div style="margin-right:auto;min-width:0"><h1 style="font-size:24px">${esc(j.title)}</h1><div class="muted small">${esc(j.city)} · ${MODE[j.workMode]} · ${salary(j)} · ${ago(j.postedAt)}</div></div>
      <button class="btn sm" data-go="publicar" data-id="${j.id}">Editar</button><button class="btn sm" data-go="vacante" data-id="${j.id}">Ver publicación</button></div>
    <div class="tabs" role="tablist"><button role="tab" data-tab="postulados" class="${gestionTab === "postulados" ? "on" : ""}">Postulados (${appRows.length})</button><button role="tab" data-tab="sugeridos" class="${gestionTab === "sugeridos" ? "on" : ""}">Candidatos sugeridos (${sugRows.length})</button></div>
    <div class="card">
      ${gestionTab === "postulados"
        ? (appRows.length ? appRows.map(({ a, c, r }) => personRow(c, r, `<span class="status">${esc(a.status)}</span><select data-status="${a.id}" aria-label="Cambiar estado" style="width:auto;padding:4px 8px;font-size:14px">${["Enviada", "En revisión", "Entrevista", "Finalista", "Descartado"].map(s => `<option${s === a.status ? " selected" : ""}>${s}</option>`).join("")}</select>`)).join("") : `<div class="empty">Aún no hay postulados. Revisa los candidatos sugeridos.</div>`)
        : (sugRows.length ? `<p class="small muted" style="margin:0 0 4px">Perfiles registrados que encajan con la vacante y aún no se han postulado, ordenados por compatibilidad.</p>` + sugRows.map(r => { const c = P.cand(r.candidateId); return personRow(c, r, invited(c.id) ? `<span class="status applied">Invitado</span>` : `<button class="btn sm primary" data-invite="${c.id}">Invitar a postularse</button>`); }).join("") : `<div class="empty">No encontramos perfiles que compartan habilidades con esta vacante.</div>`)}
    </div></div></div>`;
  app.querySelectorAll("[data-tab]").forEach(b => b.onclick = () => { gestionTab = b.dataset.tab; viewGestion(); });
  app.querySelectorAll("[data-status]").forEach(s => s.onchange = () => { D.applications.find(a => a.id === s.dataset.status).status = s.value; saveData(); toast("Estado actualizado."); viewGestion(); });
  app.querySelectorAll("[data-invite]").forEach(b => b.onclick = () => { D.invites.push({ jobId: j.id, candidateId: b.dataset.invite, at: Date.now() }); saveData(); toast(`Invitación registrada para ${P.cand(b.dataset.invite).name}.`); viewGestion(); });
}

/* ---------- Empresa: publicar / editar ---------- */
function viewPublicar() {
  const m = me(); if (m.type !== "co") return go("empleos");
  const edit = route.id ? P.job(route.id) : null;
  const j = edit || { title: "", city: m.user.city, workMode: "hybrid", experience: 1, requiredSkills: [], desiredSkills: [], salaryMin: "", salaryMax: "", contract: "Término indefinido", description: "" };
  app.innerHTML = `<div class="page wrap"><div class="inner col" style="max-width:820px">
    <h1 style="font-size:26px">${edit ? "Editar vacante" : "Publicar vacante"}</h1>
    <p class="muted" style="margin:0">Al publicar te mostraremos de inmediato los candidatos que mejor encajan.</p>
    <form class="card form" id="jf" novalidate>
      <div class="field"><label for="v_title">Cargo</label><input id="v_title" value="${esc(j.title)}" placeholder="Ej: Analista de nómina"></div>
      <div class="grid2"><div class="field"><label for="v_city">Ciudad</label><input id="v_city" value="${esc(j.city)}"></div>
        <div class="field"><label for="v_mode">Modalidad</label><select id="v_mode">${["remote", "hybrid", "onsite"].map(x => `<option value="${x}"${x === j.workMode ? " selected" : ""}>${MODE[x]}</option>`).join("")}</select></div>
        <div class="field"><label for="v_exp">Experiencia mínima (años)</label><input id="v_exp" type="number" min="0" step="0.5" value="${j.experience}"></div>
        <div class="field"><label for="v_contract">Tipo de contrato</label><select id="v_contract">${["Término indefinido", "Término fijo", "Prestación de servicios", "Aprendizaje"].map(x => `<option${x === j.contract ? " selected" : ""}>${x}</option>`).join("")}</select></div>
        <div class="field"><label for="v_smin">Salario mínimo (COP)</label><input id="v_smin" type="number" min="0" step="100000" value="${j.salaryMin}"></div>
        <div class="field"><label for="v_smax">Salario máximo (COP)</label><input id="v_smax" type="number" min="0" step="100000" value="${j.salaryMax}"></div></div>
      <div class="field"><label for="v_req">Habilidades obligatorias</label><input id="v_req" value="${esc(j.requiredSkills.join(", "))}" placeholder="Ej: Excel, Nómina"><span class="hint">Sepáralas con comas.</span></div>
      <div class="field"><label for="v_des">Habilidades deseables</label><input id="v_des" value="${esc(j.desiredSkills.join(", "))}" placeholder="Opcional"></div>
      <div class="field"><label for="v_desc">Descripción</label><textarea id="v_desc">${esc(j.description)}</textarea></div>
      <div id="v_msg"></div>
      <div><button class="btn primary" type="submit">${edit ? "Guardar cambios" : "Publicar vacante"}</button></div>
    </form></div></div>`;
  document.getElementById("jf").onsubmit = async e => {
    e.preventDefault();
    const msg = document.getElementById("v_msg");
    const data = { title: v_title.value.trim(), city: v_city.value.trim(), workMode: v_mode.value, experience: Number(v_exp.value || 0), contract: v_contract.value,
      salaryMin: Number(v_smin.value), salaryMax: Number(v_smax.value), requiredSkills: v_req.value.split(",").map(s => s.trim()).filter(Boolean),
      desiredSkills: v_des.value.split(",").map(s => s.trim()).filter(Boolean), description: v_desc.value.trim() };
    const problems = [];
    if (!data.title) problems.push("el cargo"); if (!data.city) problems.push("la ciudad");
    if (!data.requiredSkills.length) problems.push("al menos una habilidad obligatoria");
    if (!(data.salaryMin > 0) || !(data.salaryMax >= data.salaryMin)) problems.push("un rango salarial válido (el máximo no puede ser menor que el mínimo)");
    if (problems.length) { msg.innerHTML = `<div class="notice err">Falta ${problems.join(", ")}.</div>`; return; }
    let job;
    if (edit) { Object.assign(edit, data); job = edit; }
    else { job = { id: "j-" + Date.now().toString(36), companyId: m.user.id, postedAt: Date.now(), ...data }; D.jobs.push(job); }
    saveData();
    const r = await NeoConexion.upsertJob(toApiJob(job));
    if (r.status >= 300) toast("Vacante guardada. Las recomendaciones se calcularán cuando el servicio responda.");
    else toast(edit ? "Cambios guardados." : "Vacante publicada.");
    gestionTab = "sugeridos"; go("gestion", job.id);
  };
}

/* ---------- Integración (administración) ---------- */
function viewIntegracion() {
  const c = NeoConexion.config;
  app.innerHTML = `<div class="page wrap"><div class="inner col" style="max-width:760px">
    <h1 style="font-size:26px">Integración NeoConexión</h1>
    <p class="muted" style="margin:0">Conecta Empleos guarda sus propios datos (empresas, vacantes, postulaciones) y usa NeoConexión solo para calcular compatibilidad. Toda la comunicación pasa por un único cliente, así que cambiar de motor no afecta el resto de la app.</p>
    <form class="card form" id="cf">
      <div class="field"><label for="i_mode">Motor de compatibilidad</label><select id="i_mode">
        <option value="embedded"${c.mode !== "http" ? " selected" : ""}>Embebido (incluido en la app)</option>
        <option value="http"${c.mode === "http" ? " selected" : ""}>API NeoConexión por HTTP</option></select></div>
      <div class="grid2"><div class="field"><label for="i_url">URL base de la API</label><input id="i_url" value="${esc(c.baseUrl)}"></div>
        <div class="field"><label for="i_key">API Key (X-API-Key)</label><input id="i_key" type="password" value="${esc(c.apiKey)}" placeholder="Vacía si está desactivada"></div></div>
      <div class="notice info small">Esta copia de la app se publicó en un entorno que no permite llamadas a otros servidores. Para usar tu API real, aloja la app en tu propio dominio y habilita CORS para él en FastAPI.</div>
      <div id="i_msg"></div>
      <div class="head-row" style="gap:8px"><button class="btn primary" type="submit">Guardar</button><button class="btn" type="button" id="i_test">Probar conexión</button><button class="btn" type="button" id="i_sync">Sincronizar todos los datos</button></div>
    </form>
    <div class="card col"><h3 style="font-size:17px">Llamadas que hace la app</h3>
      <div class="tablewrap"><table class="table code"><tbody>
        <tr><td>Guardar perfil</td><td>POST /api/v1/candidates</td></tr><tr><td>Publicar o editar vacante</td><td>POST /api/v1/jobs</td></tr>
        <tr><td>Recomendadas y orden por compatibilidad</td><td>GET /api/v1/candidates/{id}/recommendations</td></tr>
        <tr><td>Tu compatibilidad en una vacante · postulados</td><td>GET /api/v1/candidates/{id}/jobs/{jobId}/diagnosis</td></tr>
        <tr><td>Candidatos sugeridos</td><td>GET /api/v1/jobs/{id}/candidates</td></tr></tbody></table></div></div>
  </div></div>`;
  const read = () => ({ mode: i_mode.value, baseUrl: i_url.value.trim(), apiKey: i_key.value });
  const msg = t => document.getElementById("i_msg").innerHTML = t;
  document.getElementById("cf").onsubmit = e => { e.preventDefault(); NeoConexion.saveConfig(read()); msg(`<div class="notice ok">Configuración guardada.</div>`); };
  document.getElementById("i_test").onclick = async () => { NeoConexion.saveConfig(read()); const r = await NeoConexion.health(); msg(r.status === 200 ? `<div class="notice ok">Conexión correcta con el motor ${NeoConexion.config.mode === "http" ? "remoto" : "embebido"}.</div>` : `<div class="notice err">No hubo respuesta de ${esc(NeoConexion.config.baseUrl)}. Revisa la URL, que la API esté encendida y la configuración CORS.</div>`); };
  document.getElementById("i_sync").onclick = async () => { NeoConexion.saveConfig(read()); await syncAll(); msg(`<div class="notice ok">Se enviaron ${D.jobs.length} vacantes y ${D.candidates.length} candidatos.</div>`); };
}

const VIEWS = { empleos: viewEmpleos, vacante: viewVacante, postulaciones: viewPostulaciones, perfil: viewPerfil, empresa: viewEmpresa, gestion: viewGestion, publicar: viewPublicar, integracion: viewIntegracion };

(async () => {
  if (!D) { D = freshData(); saveData(); Engine.reset(); await syncAll(); }
  else if (NeoConexion.config.mode !== "http") { await syncAll(); }
  go("empleos");
})();
})();
</script>
</body>
</html>
